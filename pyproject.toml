[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-retrieval-agent"
version = "0.1.0"
description = "NewsRetrievalAgent Python project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
news-retrieval-agent = "news_retrieval_agent.main:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/news_retrieval_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
